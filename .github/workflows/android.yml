name: Android APK

# Builds an installable PhoneLink APK on every push to main, and on demand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEY_PROPERTIES_BASE64" ] || [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing (ANDROID_KEY_PROPERTIES_BASE64 / ANDROID_UPLOAD_KEYSTORE_BASE64)." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 -d > android/key.properties
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Derive version
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          echo "BUILD_NAME=${PUBSPEC_VERSION%%+*}-phonelink.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # Run number keeps every build installable over the previous one.
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          # No SENTRY_DSN is passed, so crash reporting to Intiface's Sentry stays off.
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Verify native libraries
        # Same check as scripts/verify-android-native-libs.sh, APK only (we don't build an AAB).
        run: |
          set -euo pipefail
          contents="$(unzip -Z1 build/app/outputs/flutter-apk/app-release.apk)"
          failed=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for lib in librust_lib_intiface_central.so libapp.so libflutter.so; do
              grep -qx "lib/${abi}/${lib}" <<<"$contents" || { echo "FAIL: missing lib/${abi}/${lib}" >&2; failed=1; }
            done
          done
          exit "$failed"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: phonelink-${{ env.BUILD_NAME }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
